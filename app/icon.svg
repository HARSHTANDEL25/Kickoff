  <line x1="24.5" y1="10.5" x2="19.2" y2="13.8" stroke="#00F5D4" stroke-width="1.1"/>
  <line x1="22" y1="23.5" x2="18" y2="17.5" stroke="#00F5D4" stroke-width="1.1"/>
  <line x1="10" y1="23.5" x2="14" y2="17.5" stroke="#00F5D4" stroke-width="1.1"/>
  <line x1="7.5" y1="10.5" x2="12.8" y2="13.8" stroke="#00F5D4" stroke-width="1.1"/>
</svg>
